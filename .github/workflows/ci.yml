name: ci

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: wtnb75/actions/golang@c1711251ea69e3e6d68db7a9fa019d79b497f70c # v1.0.3
    - name: prepare yaegi
      run: go install github.com/traefik/yaegi/cmd/yaegi@v0.16.1
      shell: bash
    - uses: wtnb75/actions/gotest@c1711251ea69e3e6d68db7a9fa019d79b497f70c # v1.0.3
    - name: yaegi test
      run: yaegi test .
      shell: bash
