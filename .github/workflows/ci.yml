name: ci

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: wtnb75/actions/golang@e91993ee54862b807c74f88477c8818b6c300d5b # v1.0.0
    - name: prepare yaegi
      run: go install github.com/traefik/yaegi/cmd/yaegi@v0.16.1
      shell: bash
    - uses: wtnb75/actions/gotest@e91993ee54862b807c74f88477c8818b6c300d5b # v1.0.0
    - name: yaegi test
      run: yaegi test .
      shell: bash
